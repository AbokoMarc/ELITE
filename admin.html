<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ELITE — Administration</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ivory:'#F8F5F0', ink:'#111827', navy:'#102542', wine:'#6B1D2A', gold:'#C9A86A' },
      fontFamily: { serif:['"Playfair Display"','Georgia','serif'], sans:['Inter','system-ui','sans-serif'] } } } };
  </script>
  <style>
    body { background:#F8F5F0; color:#111827; font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    :focus-visible { outline:2px solid #6B1D2A; outline-offset:2px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; min-height:40px; padding:0 1rem; font-size:.8rem; font-weight:600; border:1px solid #102542; color:#102542; background:transparent; cursor:pointer; }
    .btn:hover { background:#102542; color:#F8F5F0; }
    .btn-solid { background:#102542; color:#F8F5F0; }
    .btn-solid:hover { background:#0a1a30; }
    .btn-danger { border-color:#6B1D2A; color:#6B1D2A; }
    .btn-danger:hover { background:#6B1D2A; color:#F8F5F0; }
    .f { min-height:40px; padding:0 .9rem; font-size:.8rem; font-weight:500; border:1px solid rgba(16,37,66,.25); background:transparent; cursor:pointer; color:#102542; }
    .f[aria-pressed="true"] { background:#102542; color:#F8F5F0; border-color:#102542; }
    input[type=email], input[type=password] { width:100%; background:#fff; border:1px solid rgba(16,37,66,.25); padding:.75rem .85rem; font-size:.95rem; }
    input:focus { outline:none; border-color:#102542; box-shadow:0 2px 0 0 #C9A86A; }
    .vt { padding:.7rem 0; font-size:.85rem; font-weight:600; color:rgba(17,24,39,.6); background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; cursor:pointer; }
    .vt[aria-selected="true"] { color:#102542; border-bottom-color:#102542; }
    .kpi { background:#fff; border:1px solid rgba(16,37,66,.15); padding:1rem 1.1rem; }
    .kpi b { display:block; font-family:'Playfair Display',Georgia,serif; font-size:2rem; line-height:1.1; color:#102542; }
    .kpi span { display:block; margin-top:.35rem; font-size:.7rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:rgba(17,24,39,.6); }
    .kpi small { display:block; margin-top:.2rem; font-size:.75rem; color:rgba(17,24,39,.55); }
    .badge { display:inline-block; font-size:.65rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; padding:.2rem .5rem; border:1px solid currentColor; }
  </style>
</head>
<body>

  <!-- Connexion -->
  <main id="loginView" class="min-h-screen grid place-items-center px-5">
    <form id="loginForm" class="w-full max-w-sm bg-white border border-navy/15 p-7" novalidate>
      <p class="text-[.7rem] font-semibold tracking-[.2em] uppercase text-wine">ELITE · Administration</p>
      <h1 class="mt-2 font-serif text-2xl font-bold text-navy">Connexion</h1>
      <span class="block w-12 h-0.5 bg-gold mt-3"></span>
      <label class="block mt-6 text-xs font-semibold uppercase tracking-wider text-navy" for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" class="mt-1.5" required>
      <label class="block mt-4 text-xs font-semibold uppercase tracking-wider text-navy" for="pwd">Mot de passe</label>
      <input id="pwd" type="password" autocomplete="current-password" class="mt-1.5" required>
      <button class="btn btn-solid w-full mt-6" type="submit">Se connecter</button>
      <p id="loginErr" class="mt-3 text-sm text-wine" role="alert"></p>
    </form>
  </main>

  <!-- Tableau de bord -->
  <div id="appView" class="hidden">
    <header class="bg-navy text-ivory">
      <div class="mx-auto max-w-5xl px-5 py-4 flex flex-wrap items-center justify-between gap-3">
        <div><p class="font-serif text-xl font-semibold">ELITE · Administration</p><p id="summary" class="text-xs text-ivory/70"></p></div>
        <div class="flex gap-2">
          <button id="refreshBtn" class="btn !border-ivory/50 !text-ivory hover:!bg-ivory hover:!text-navy" type="button">Actualiser</button>
          <button id="csvBtn" class="btn !border-ivory/50 !text-ivory hover:!bg-ivory hover:!text-navy" type="button">Export CSV</button>
          <button id="logoutBtn" class="btn !border-ivory/50 !text-ivory hover:!bg-ivory hover:!text-navy" type="button">Déconnexion</button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-5xl px-5 py-6">
      <div class="flex gap-6 border-b border-navy/15 mb-6" role="tablist" aria-label="Sections">
        <button type="button" role="tab" class="vt" data-view="inbox" aria-selected="true">Messages</button>
        <button type="button" role="tab" class="vt" data-view="stats" aria-selected="false">Statistiques de visite</button>
      </div>

      <section id="inboxView">
        <div id="filters" class="flex flex-wrap gap-2" role="group" aria-label="Filtrer"></div>
        <p id="state" class="mt-6 text-sm text-ink/60" aria-live="polite"></p>
        <ul id="list" class="mt-4 grid gap-3"></ul>
      </section>

      <section id="statsView" class="hidden">
        <div id="statsBody"></div>
      </section>
    </main>
  </div>

<script>
(() => {
  "use strict";
  /* Mêmes valeurs que dans index.html (Supabase > Project Settings > API) */
  const SUPABASE_URL      = "https://gjjmiuwqovhodjsyzoeu.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdqam1pdXdxb3Zob2Rqc3l6b2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNTY4MTUsImV4cCI6MjEwODkzMjgxNX0.WqAo9tYz4kZ5SCky_X5DZQXcITO2tF3jUXxUpEbkbE4";

  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const LABEL = {adhesion:"Adhésion", message:"Message", temoignage:"Témoignage"};
  const FILTERS = [["all","Tous"],["unread","Non lus"],["adhesion","Adhésions"],["message","Messages"],["temoignage","Témoignages"],["pending","À valider"]];
  let session = null, rows = [], filter = "all";

  const loadSession = () => { try { return JSON.parse(sessionStorage.getItem("elite_admin")); } catch { return null; } };
  const saveSession = s => { session = s; s ? sessionStorage.setItem("elite_admin", JSON.stringify(s)) : sessionStorage.removeItem("elite_admin"); };

  async function auth(body, grant){
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {method:"POST", headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"}, body:JSON.stringify(body)});
    if (!r.ok) throw new Error("auth");
    const d = await r.json();
    saveSession({access:d.access_token, refresh:d.refresh_token});
  }

  /* Appel REST authentifié, avec un renouvellement automatique du jeton */
  async function api(path, opts = {}, retry = true){
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {...opts, headers:{apikey:SUPABASE_ANON_KEY, Authorization:"Bearer "+session.access, "Content-Type":"application/json", ...(opts.headers||{})}});
    if ((r.status === 401 || r.status === 403) && retry && session.refresh) {
      try { await auth({refresh_token:session.refresh}, "refresh_token"); return api(path, opts, false); } catch { logout(); throw new Error("expired"); }
    }
    if (!r.ok) throw new Error(r.status);
    return r.status === 204 ? null : r.json().catch(() => null);
  }

  function show(app){ $("#loginView").classList.toggle("hidden", app); $("#appView").classList.toggle("hidden", !app); }
  function logout(){ saveSession(null); rows = []; show(false); }

  async function load(){
    $("#state").textContent = "Chargement…";
    try { rows = await api("submissions?select=*&order=created_at.desc&limit=500"); render(); }
    catch (e) { if (e.message !== "expired") $("#state").textContent = "Impossible de charger les données. Vérifiez la configuration."; }
  }

  function visible(){
    return rows.filter(r => filter === "all" ? true : filter === "unread" ? !r.is_read : filter === "pending" ? (r.type === "temoignage" && !r.approved) : r.type === filter);
  }

  function render(){
    const unread = rows.filter(r => !r.is_read).length, pending = rows.filter(r => r.type === "temoignage" && !r.approved).length;
    $("#summary").textContent = `${rows.length} reçus · ${unread} non lus · ${pending} témoignage(s) à valider`;
    $("#filters").innerHTML = FILTERS.map(([k,l]) => `<button type="button" class="f" data-f="${k}" aria-pressed="${k===filter}">${l}</button>`).join("");
    const list = visible();
    $("#state").textContent = list.length ? "" : "Rien à afficher pour ce filtre.";
    $("#list").innerHTML = list.map(r => {
      const d = new Date(r.created_at).toLocaleString("fr-FR", {dateStyle:"medium", timeStyle:"short"});
      const mail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email || "") ? `<a class="underline decoration-gold decoration-2 underline-offset-4" href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : "";
      const isT = r.type === "temoignage";
      return `<li class="bg-white border border-navy/15 p-4 sm:p-5 ${r.is_read ? "" : "border-l-4 !border-l-navy"}">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
          <span class="badge ${isT ? "text-wine" : "text-navy"}">${LABEL[r.type] || esc(r.type)}</span>
          ${isT ? `<span class="badge ${r.approved ? "text-green-800" : "text-ink/50"}">${r.approved ? "Publié" : "En attente"}</span>` : ""}
          <b class="text-navy">${esc(r.nom)}</b><span class="text-xs text-ink/55">${d}</span>
        </div>
        <p class="mt-1 text-sm text-ink/70">${[mail, esc(r.filiere)].filter(Boolean).join(" · ")}</p>
        ${r.message ? `<p class="mt-3 whitespace-pre-wrap leading-relaxed">${esc(r.message)}</p>` : ""}
        <div class="mt-4 flex flex-wrap gap-2">
          ${isT ? `<button class="btn btn-solid" data-act="approve" data-id="${esc(r.id)}">${r.approved ? "Retirer du site" : "Publier sur le site"}</button>` : ""}
          <button class="btn" data-act="read" data-id="${esc(r.id)}">${r.is_read ? "Marquer non lu" : "Marquer lu"}</button>
          <button class="btn btn-danger" data-act="del" data-id="${esc(r.id)}">Supprimer</button>
        </div></li>`;
    }).join("");
  }

  $("#filters").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (b) { filter = b.dataset.f; render(); } });
  $("#list").addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const row = rows.find(r => r.id === b.dataset.id); if (!row) return;
    const q = `submissions?id=eq.${encodeURIComponent(row.id)}`;
    try {
      if (b.dataset.act === "approve") { await api(q, {method:"PATCH", body:JSON.stringify({approved:!row.approved, is_read:true})}); row.approved = !row.approved; row.is_read = true; }
      else if (b.dataset.act === "read") { await api(q, {method:"PATCH", body:JSON.stringify({is_read:!row.is_read})}); row.is_read = !row.is_read; }
      else if (b.dataset.act === "del") { if (!confirm("Supprimer définitivement cette entrée ?")) return; await api(q, {method:"DELETE"}); rows = rows.filter(r => r !== row); }
      render();
    } catch { alert("Action impossible. Réessayez."); }
  });


  /* ---------- Statistiques de visite ---------- */
  let view = "inbox";
  function setView(v){
    view = v;
    document.querySelectorAll(".vt").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === v)));
    $("#inboxView").classList.toggle("hidden", v !== "inbox");
    $("#statsView").classList.toggle("hidden", v !== "stats");
    if (v === "stats") loadStats();
  }
  document.querySelector('[role="tablist"]').addEventListener("click", e => { const b = e.target.closest(".vt"); if (b) setView(b.dataset.view); });

  const pct = (n, t) => t ? Math.round(n * 100 / t) : 0;
  function bars(obj, labels = {}){
    const e = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]), t = e.reduce((s, x) => s + x[1], 0);
    if (!t) return '<p class="text-sm text-ink/55">Aucune donnée pour l\'instant.</p>';
    return e.map(([k, n]) => `<div class="mt-3"><div class="flex justify-between text-sm"><span>${esc(labels[k] || k)}</span><span class="text-ink/60">${n} · ${pct(n, t)} %</span></div><div class="mt-1 h-2 bg-navy/10"><div class="h-2 bg-navy" style="width:${pct(n, t)}%"></div></div></div>`).join("");
  }
  const card = (t, inner) => `<div class="bg-white border border-navy/15 p-5"><h3 class="font-serif text-lg font-semibold text-navy">${t}</h3>${inner}</div>`;

  async function loadStats(){
    const box = $("#statsBody");
    box.innerHTML = '<p class="text-sm text-ink/60">Chargement…</p>';
    try { renderStats(await api("rpc/visit_stats", {method:"POST", body:"{}"})); }
    catch (e) { if (e.message !== "expired") box.innerHTML = '<p class="text-sm text-wine">Statistiques indisponibles. Relancez le fichier supabase.sql dans Supabase (SQL Editor), puis actualisez.</p>'; }
  }

  function renderStats(s){
    const days = [], map = {}; (s.by_day || []).forEach(x => map[x.d] = x);
    for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = d.toLocaleDateString("en-CA"); days.push({k, label: d.getDate(), ...(map[k] || {visits:0, uniq:0})}); }
    const max = Math.max(1, ...days.map(d => d.visits));
    const avg = s.unique ? (s.total / s.unique).toFixed(1).replace(".", ",") : "0";
    const kpis = [
      [s.total, "Visites au total", `${avg} visite(s) par appareil en moyenne`],
      [s.unique, "Appareils différents", "navigateurs uniques"],
      [s.today, "Aujourd'hui", `${s.today_unique} appareil(s)`],
      [s.week, "7 derniers jours", `${s.week_unique} appareil(s)`],
      [s.month, "30 derniers jours", `${s.month_unique} appareil(s)`],
      [s.returning, "Retours", `${pct(s.returning, s.total)} % des visites viennent d'appareils déjà venus`]
    ];
    $("#statsBody").innerHTML =
      `<div class="grid gap-3 grid-cols-2 lg:grid-cols-3">${kpis.map(([n, l, sm]) => `<div class="kpi"><b>${n ?? 0}</b><span>${l}</span><small>${sm}</small></div>`).join("")}</div>

       ${card("14 derniers jours", `<div class="mt-4 flex items-end gap-1.5 h-40" role="img" aria-label="Visites par jour">${days.map(d => `<div class="flex-1 flex flex-col items-center justify-end h-full" title="${d.k} : ${d.visits} visite(s), ${d.uniq} appareil(s)"><span class="text-[.65rem] text-ink/55 mb-0.5">${d.visits || ""}</span><div class="w-full max-w-[22px] bg-navy" style="height:${Math.max(d.visits ? 3 : 1, Math.round(d.visits * 100 / max))}%"></div></div>`).join("")}</div>
          <div class="mt-1 flex gap-1.5">${days.map(d => `<span class="flex-1 text-center text-[.65rem] text-ink/50">${d.label}</span>`).join("")}</div>`).replace('class="bg-white', 'class="mt-3 bg-white')}

       <div class="mt-3 grid gap-3 md:grid-cols-2">
         ${card("Type d'appareil", bars(s.by_device, {mobile:"Téléphone", tablet:"Tablette", desktop:"Ordinateur"}))}
         ${card("Combien de fois reviennent-ils ?", bars(s.freq, {"1":"1 seule visite", "2-3":"2 à 3 visites", "4-9":"4 à 9 visites", "10+":"10 visites et plus"}))}
         ${card("Système", bars(s.by_os))}
         ${card("Navigateur", bars(s.by_browser))}
         ${card("Provenance", bars(s.by_referrer))}
       </div>
       <p class="mt-4 text-xs text-ink/55 leading-relaxed">Un « appareil » correspond à un navigateur identifié par un code aléatoire : la même personne sur son téléphone et sur un ordinateur compte pour deux, et vider les données du navigateur crée un nouvel appareil. Une visite = une session (un seul comptage même si la page est rechargée). Aucune adresse IP ni donnée personnelle n'est enregistrée. Vos propres visites : ouvrez une fois <code>votre-site/?notrack=1</code> pour les exclure.</p>`;
  }

  $("#csvBtn").addEventListener("click", () => {
    const cols = ["created_at","type","nom","email","filiere","message","approved","is_read"];
    const cell = v => { let s = String(v ?? ""); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };   // neutralise les formules Excel
    const csv = "\ufeff" + [cols.join(",")].concat(rows.map(r => cols.map(c => cell(r[c])).join(","))).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
    a.download = "elite-" + new Date().toISOString().slice(0,10) + ".csv"; a.click(); URL.revokeObjectURL(a.href);
  });
  $("#refreshBtn").addEventListener("click", load);
  $("#logoutBtn").addEventListener("click", logout);

  $("#loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const err = $("#loginErr"); err.textContent = "";
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) { err.textContent = "Renseignez SUPABASE_URL et SUPABASE_ANON_KEY dans admin.html."; return; }
    try { await auth({email:$("#email").value.trim(), password:$("#pwd").value}, "password"); $("#pwd").value = ""; show(true); load(); }
    catch { err.textContent = "Identifiants incorrects."; }
  });

  session = loadSession();
  if (session && SUPABASE_URL) { show(true); load(); }
})();
</script>
</body>
</html>
